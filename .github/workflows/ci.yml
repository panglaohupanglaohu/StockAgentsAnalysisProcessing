name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      AG_ALLOW_DEFAULT_ADMIN: '0'
      AG_STRICT_STARTUP: '0'
      DEEPSEEK_API_KEY: test-key-not-real
      OPENAI_API_KEY: test-key-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile backend
        run: python -m compileall -q src/backend
      - name: Run backend tests
        run: >-
          python -m pytest -q
          src/backend/tests/test_main_health.py
          src/backend/tests/test_startup_validator.py
          src/backend/tests/test_team_manager.py
          src/backend/tests/test_plaza_dispatch.py

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:frontend:smoke

  legacy-backend-baseline:
    name: Full backend baseline (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      AG_ALLOW_DEFAULT_ADMIN: '0'
      AG_STRICT_STARTUP: '0'
      DEEPSEEK_API_KEY: test-key-not-real
      OPENAI_API_KEY: test-key-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --tb=short

  legacy-frontend-baseline:
    name: Full frontend baseline (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:frontend
