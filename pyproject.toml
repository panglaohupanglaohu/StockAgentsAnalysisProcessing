[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockagents"
version = "0.1.0"
description = "Agentic market intelligence and stock investment simulation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "StockAgents Contributors" }]
keywords = ["agents", "market-intelligence", "multi-agent", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "aiohttp>=3.9.0",
  "cryptography>=42.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
]
trading = [
  "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@01477f9",
]

[project.urls]
Documentation = "https://github.com/OWNER/StockAgents/tree/main/docs"
Issues = "https://github.com/OWNER/StockAgents/issues"
Repository = "https://github.com/OWNER/StockAgents"

[tool.setuptools.packages.find]
where = ["src/backend"]
include = ["agents*", "channels*", "domain*", "integrations*", "monitoring*", "sandbox*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src/backend"]
testpaths = ["src/backend/tests"]
markers = [
  "integration: tests that cross service or process boundaries",
  "slow: tests that are intentionally slower than unit tests",
]

